<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Share your experience with our products by submitting a review.">
  <title>Product Review Form</title>
    <meta name="author" content="kevin nicolas flores gonzalez">

  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>

<body>
  <header>
  <img src="images/hands-on-logo.svg" alt="Hands On logo" width="60" height="60">
  <h1>Product Review</h1>
</header>

  <main>
    <form action="review.html" method="get">
      <p class="note"><span class="req">*</span> Required field</p>

      <div class="field">
        <label for="product">Product Name <span class="req">*</span></label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="field">
        <legend>Overall Rating <span class="req">*</span></legend>
        <div class="rating">
          <input type="radio" id="rating1" name="rating" value="1" required>
          <label for="rating1">1 &star;</label>
          <input type="radio" id="rating2" name="rating" value="2" required>
          <label for="rating2">2 &star;</label>
          <input type="radio" id="rating3" name="rating" value="3" required>
          <label for="rating3">3 &star;</label>
          <input type="radio" id="rating4" name="rating" value="4" required>
          <label for="rating4">4 &star;</label>
          <input type="radio" id="rating5" name="rating" value="5" required>
          <label for="rating5">5 &star;</label>
        </div>
      </fieldset>

      <div class="field">
        <label for="install">Date of Installation <span class="req">*</span></label>
        <input type="date" id="install" name="install" required>
      </div>

      <fieldset class="field">
        <legend>Useful Features</legend>
        <div class="checks">
          <div>
            <input type="checkbox" id="durable" name="features" value="durability">
            <label for="durable">Durability</label>
          </div>
          <div>
            <input type="checkbox" id="easy" name="features" value="ease-of-use">
            <label for="easy">Ease of use</label>
          </div>
          <div>
            <input type="checkbox" id="design" name="features" value="design">
            <label for="design">Design</label>
          </div>
          <div>
            <input type="checkbox" id="value" name="features" value="value">
            <label for="value">Good value</label>
          </div>
        </div>
      </fieldset>

      <div class="field">
        <label for="review">Written Review</label>
        <textarea id="review" name="review" rows="5"></textarea>
      </div>

      <div class="field">
        <label for="username">Your Name</label>
        <input type="text" id="username" name="username">
      </div>

      <input type="submit" value="Submit Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> | Kevin Flores | Buenos Aires, Argentina</p>
    <p>Last Modification: <span id="lastModified"></span></p>
  </footer>
</body>

</html>
