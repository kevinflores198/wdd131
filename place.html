<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Page</title>
    <meta name="description" content="hi this my second home page,
    it is going to have some information about 
    me. it shows something about resources that i use to develope websites.">
    <meta name="author" content="kevin Flores">

    <link rel="stylesheet" href="styles/place.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Esteban&family=Montserrat:ital,wght@0,300;1,300&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script defer src="scripts/place.js"></script>
    <script defer src="scripts/getdates.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="body-container">
        <header>
            <span id="course-title">Santa Catarina</span>
        </header>
        <main>
            <picture>
                <source srcset="images/hero-large.webp" media="(min-width: 600px)">
                <img src="images/hero.webp" alt="Florianopolis">
            </picture>

            <div class="cards">
                <section class="card card1">
                    <h2>Data</h2>
                    <div class="label-content">
                        <label for="">Area: 433,317 km²</label>
                        <label for="">Population: 8.3 million</label>
                        <label for="">Capital: Florianopolis</label>
                        <label for="">Languages: Portuguese</label>
                        <label for="">Currency: BRL Real</label>
                        <label for="">Time Zone: GMT-3</label>
                        <label for="">Calling code: +48</label>
                    </div>
                </section>

                <section class="card card2">
                    <h2>Weather</h2>
                    <div class="label-content">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 640 640">
                            <path d="..." fill="#04080F" />
                        </svg>
                        <label for="">Temperature: 30°C</label>
                        <label for="">Conditions: Partly Cloudy</label>
                        <label for="">Wind: 11km/h</label>
                        <label for="">Wind Chill: <span id="windchill"></span></label>
                        <label for="">Humidity: 92%</label>
                    </div>
                </section>
            </div>
        </main>
        <footer>
            <p>&copy; <span id="currentyear"></span> Kevin Flores - Buenos Aires, Argentina</p>
            <p><span id="lastmodified"></span></p>
        </footer>
    </div>
</body>

</html>
